<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        /* Ensure full screen height and width without overflow */
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background-color: black;
        }

        /* Game board should scale well on all screen sizes */
        #game-board {
            background-color: white;
            width: min(90vmin, 500px);
            height: min(90vmin, 500px);
            display: grid;
            grid-template-rows: repeat(21, 1fr);
            grid-template-columns: repeat(21, 1fr);
            border: 2px solid black; /* Optional for better visibility */
        }

        /* Snake body parts */
        .snake {
            background-color: #badd78;
            border: 1px solid black;
        }

        /* Food block */
        .food {
            background-color: #ad2f2f;
            border: 1px solid black;
        }
    </style>
    <script src="game.js" defer type="module"></script>
</head>
<body>
    <div id="game-board"></div>
</body>
</html>
